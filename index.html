<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axelle Poncet — Cheffe de projet Data &amp; IA</title>
<meta name="description" content="Portfolio d'Axelle Poncet, cheffe de projet Data & IA. CRO, analytics et IA appliquée. Réalisations chiffrées, prix et projets.">
<meta name="author" content="Axelle Poncet">
<meta property="og:title" content="Axelle Poncet — Cheffe de projet Data & IA">
<meta property="og:description" content="Là où la donnée devient décision.">
<meta property="og:image" content="assets/photo-axelle.jpg">
<meta property="og:type" content="profile">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d1526'/><text x='50' y='68' font-size='50' font-family='system-ui,sans-serif' font-weight='700' fill='%2338bdf8' text-anchor='middle'>AP</text></svg>">
<style>
:root{
  --bg:#f7f8fb;
  --bg-grad:radial-gradient(900px 480px at 12% -8%, #e9f0ff 0%, transparent 62%),radial-gradient(760px 420px at 92% 2%, #e6fafd 0%, transparent 58%);
  --surface:#ffffff; --surface-2:#f2f5f9; --surface-3:#e7ecf4;
  --ink:#0d1526; --ink-2:#44546e; --ink-3:#57677e;
  --line:#e4e9f0; --line-2:#ccd6e4;
  --accent:#1d4ed8; --accent-soft:#e8eeff; --accent-2:#0e7490; --accent-3:#6d28d9;
  --ok:#047857; --ok-soft:#e3f5ef; --warn:#a45309; --warn-soft:#fdf3e3; --bad:#c2261f; --bad-soft:#fdeded;
  --gold:#a16207; --gold-soft:#fdf6e3;
  --hero-bg:linear-gradient(135deg,#eef3ff 0%,#e9f6fb 52%,#f3efff 100%);
  --hero-ink:#0d1526; --hero-ink-2:#44546e; --hero-line:rgba(29,78,216,.14); --hero-grid:rgba(29,78,216,.055);
  --shadow:0 1px 2px rgba(13,21,38,.04), 0 10px 26px -16px rgba(13,21,38,.16);
  --shadow-lg:0 2px 5px rgba(13,21,38,.05), 0 28px 54px -24px rgba(13,21,38,.24);
  --radius:18px; --radius-sm:11px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --maxw:1140px;
}
html[data-theme="dark"]{
  --bg:#121826;
  --bg-grad:radial-gradient(900px 480px at 12% -8%, #1c2a4d 0%, transparent 62%),radial-gradient(760px 420px at 92% 2%, #133544 0%, transparent 58%);
  --surface:#1b2333; --surface-2:#232d40; --surface-3:#2d3850;
  --ink:#f2f6fc; --ink-2:#bccadf; --ink-3:#93a2ba;
  --line:#2e3a50; --line-2:#3e4c67;
  --accent:#82b4ff; --accent-soft:#22304e; --accent-2:#4fd8ee; --accent-3:#bba4ff;
  --ok:#4ade80; --ok-soft:#14372a; --warn:#fcbf49; --warn-soft:#3a2e12; --bad:#fb8a8a; --bad-soft:#3a1d1d;
  --gold:#fcd34d; --gold-soft:#372c10;
  --hero-bg:linear-gradient(135deg,#1a2743 0%,#152f42 52%,#221f47 100%);
  --hero-ink:#f2f6fc; --hero-ink-2:#bccadf; --hero-line:rgba(130,180,255,.22); --hero-grid:rgba(255,255,255,.045);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -16px rgba(0,0,0,.7);
  --shadow-lg:0 2px 5px rgba(0,0,0,.3), 0 28px 54px -24px rgba(0,0,0,.85);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;color:var(--ink);line-height:1.68;-webkit-font-smoothing:antialiased;font-size:15.5px}
h1,h2,h3,h4{line-height:1.24;margin:0;letter-spacing:-.02em;font-weight:700}
p{margin:0 0 1em}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent);color:var(--bg)}
img{max-width:100%}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* HEADER */
header.top{position:sticky;top:0;z-index:60;backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 84%,transparent);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;height:68px}
.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.03em;font-size:16px;white-space:nowrap}
.brand .mark{width:36px;height:36px;border-radius:11px;overflow:hidden;flex-shrink:0;box-shadow:0 4px 12px -5px rgba(0,0,0,.4)}
.brand .mark img{width:100%;height:100%;object-fit:cover;display:block}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3);letter-spacing:0}
.top-spacer{flex:1}
.iconbtn{height:38px;min-width:38px;padding:0 11px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;transition:.16s}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.langsw{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface);height:38px}
.langsw button{border:0;background:transparent;color:var(--ink-3);padding:0 12px;font-size:12.5px;font-weight:700;transition:.16s}
.langsw button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.btn-cv{height:38px;padding:0 16px;border-radius:10px;border:0;color:#fff;font-weight:650;font-size:13.5px;background:linear-gradient(135deg,#2563eb,#0891b2);box-shadow:0 6px 18px -8px #2563eb;display:inline-flex;align-items:center;gap:8px;transition:.16s}
.btn-cv:hover{transform:translateY(-1px);text-decoration:none;color:#fff}

/* SEARCH */
.searchbar{position:relative;flex:1;max-width:330px}
.searchbar input{width:100%;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:0 42px 0 36px;color:var(--ink);font-size:13.5px;font-family:inherit;transition:.16s}
.searchbar input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbar .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;display:flex}
.go-btn{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:7px;border:0;background:var(--accent);color:var(--bg);display:grid;place-items:center;transition:.16s}
.go-btn:hover{filter:brightness(1.12)}
.results{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-lg);max-height:min(66vh,520px);overflow:auto;padding:8px;display:none;z-index:70}
.results.on{display:block}
.res-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);padding:9px 11px 5px;font-weight:750}
.res-item{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:10px 11px;color:var(--ink);transition:.12s}
.res-item:hover,.res-item.sel{background:var(--accent-soft)}
.res-item .rt{font-weight:650;font-size:13.5px;display:flex;align-items:center;gap:8px}
.res-item .rs{font-size:12px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-tab{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:750;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2px 6px;white-space:nowrap}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:6px 11px 11px}
.sugg button{border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;transition:.14s}
.sugg button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
mark{background:color-mix(in srgb,var(--accent) 26%,transparent);color:inherit;padding:0 2px;border-radius:3px}
mark.sq{background:#ffd84d;color:#111;box-shadow:0 0 0 2px #ffd84d}
html[data-theme="dark"] mark.sq{background:#facc15;color:#111;box-shadow:0 0 0 2px #facc15}

/* TABS */
nav.tabs{position:sticky;top:68px;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;flex-wrap:wrap;gap:4px;overflow:visible;padding:9px 0}
.tab{border:0;background:transparent;color:var(--ink-2);padding:8px 12px;border-radius:10px;font-weight:620;font-size:13.2px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:.16s}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab svg{width:15px;height:15px;opacity:.85}

/* LAYOUT */
main{padding:74px 0 110px;min-height:70vh}
section.panel{display:none;animation:fade .34s cubic-bezier(.2,.7,.3,1)}
section.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;font-weight:750;color:var(--accent);margin-bottom:11px;display:flex;align-items:center;gap:10px}
.eyebrow::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--line-2),transparent)}
h2.sec{font-size:clamp(24px,3.4vw,32px);margin-bottom:10px}
.lede{color:var(--ink-2);max-width:68ch;font-size:16px;margin-bottom:38px}
.blk{margin-bottom:60px}
.blk-last{margin-bottom:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:26px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:920px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* HERO */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:52px 52px;color:var(--hero-ink);margin:0 0 54px;background:var(--hero-bg);border:1px solid var(--hero-line);box-shadow:var(--shadow-lg)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--hero-grid) 1px,transparent 1px),linear-gradient(90deg,var(--hero-grid) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(620px 340px at 84% 12%,#000 0%,transparent 76%)}
.hero-in{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 232px;gap:52px;align-items:center}
@media(max-width:820px){.hero-in{grid-template-columns:1fr;gap:30px;justify-items:start}}
.hero-txt{min-width:0}
.avatar{width:232px;height:290px;border-radius:22px;object-fit:cover;object-position:center;box-shadow:var(--shadow-lg);border:5px solid var(--surface);display:block}
@media(max-width:820px){.avatar{width:150px;height:186px}}
.avail{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:650;color:var(--ok);background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent);border-radius:99px;padding:6px 14px;margin-bottom:22px}
.avail .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hero h1{font-size:clamp(32px,5.2vw,47px);letter-spacing:-.035em;margin-bottom:9px}
.hero .role{font-size:clamp(16px,2.3vw,20px);font-weight:650;margin-bottom:18px;color:var(--accent)}
.hero p.pitch{color:var(--hero-ink-2);font-size:16px;line-height:1.66;margin-bottom:0}
.hero-meta{display:flex;gap:20px;flex-wrap:wrap;margin-top:24px;font-size:13.5px}
.hero-meta a,.hero-meta span{display:inline-flex;align-items:center;gap:7px;color:var(--hero-ink-2)}
.hero-meta a:hover{color:var(--accent)}

/* STATS / PILLARS */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;position:relative;overflow:hidden;transition:.2s;box-shadow:var(--shadow)}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent-2))}
.stat .v{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.045em;line-height:1}
.stat .v small{font-size:14px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.stat .k{font-size:13px;color:var(--ink-2);margin-top:11px;line-height:1.5}
.pillar{padding:26px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:.2s}
.pillar:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.pillar .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:16px;background:var(--accent-soft);color:var(--accent)}
.pillar h3{font-size:17px;margin-bottom:9px}
.pillar p{font-size:14px;color:var(--ink-2);margin:0}

/* SUB-TABS */
.subtabs{display:inline-flex;gap:4px;padding:5px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:30px;flex-wrap:wrap}
.subtabs button{border:0;background:transparent;color:var(--ink-2);padding:9px 17px;border-radius:9px;font-weight:620;font-size:13.8px;transition:.16s;display:inline-flex;align-items:center;gap:8px}
.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* TIMELINE */
.tl{position:relative;padding-left:32px}
.tl::before{content:"";position:absolute;left:9px;top:10px;bottom:10px;width:2px;background:linear-gradient(180deg,var(--accent),var(--accent-2) 45%,var(--line-2))}
.tl-item{position:relative;margin-bottom:16px}
.tl-item::before{content:"";position:absolute;left:-28px;top:24px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent);z-index:2}
.tl-item.edu::before{border-color:var(--accent-3)}
.tl-item.asso::before{border-color:var(--gold)}
.tl-head{display:flex;gap:14px;align-items:flex-start;padding:19px 22px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);transition:.18s;color:var(--ink)}
.tl-head:hover{border-color:var(--accent)}
.tl-item.open .tl-head{border-radius:var(--radius) var(--radius) 0 0;border-bottom-color:transparent}
.tl-head .who{flex:1}
.tl-head .date{font-family:var(--mono);font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:4px 9px;font-weight:650;white-space:nowrap}
.tl-item.edu .tl-head .date{color:var(--accent-3);background:color-mix(in srgb,var(--accent-3) 14%,transparent)}
.tl-item.asso .tl-head .date{color:var(--gold);background:var(--gold-soft)}
.tl-head h3{font-size:16.5px;margin-bottom:3px}
.tl-head .org{font-size:13.5px;color:var(--ink-2);font-weight:560}
.tl-head .tag{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.caret{width:16px;height:16px;color:var(--ink-3);transition:transform .22s;flex-shrink:0;margin-top:4px}
.tl-item.open .caret,.fold.open>button .caret{transform:rotate(180deg)}
.tl-body{display:none;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);background:var(--surface);padding:4px 22px 22px}
.tl-item.open .tl-body{display:block;animation:fade .26s}
.tl-body ul{margin:0;padding-left:19px}
.tl-body li{margin-bottom:9px;font-size:14.2px;color:var(--ink-2)}
.tl-body li strong{color:var(--ink);font-weight:640}

/* FOLD */
.fold{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.fold+.fold{margin-top:14px}
.fold>button{width:100%;display:flex;align-items:center;gap:14px;padding:18px 22px;border:0;background:transparent;text-align:left;color:var(--ink);transition:.15s}
.fold>button:hover{background:var(--surface-2)}
.fold>button h3{font-size:15.5px;flex:1}
.fold-body{display:none;padding:0 22px 22px;border-top:1px solid var(--line)}
.fold.open .fold-body{display:block;animation:fade .26s}
.badge{font-size:10.5px;font-weight:750;text-transform:uppercase;letter-spacing:.06em;border-radius:6px;padding:4px 8px;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.badge.gold{background:var(--gold-soft);color:var(--gold)}

/* THEME GROUP (missions) */
.theme{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.theme>.th-hd{width:100%;display:flex;align-items:center;gap:16px;padding:21px 24px;border:0;background:transparent;text-align:left;color:var(--ink);transition:.15s}
.theme>.th-hd:hover{background:var(--surface-2)}
.theme .th-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex-shrink:0}
.theme .th-tx{flex:1}
.theme .th-tx h3{font-size:17px;margin-bottom:3px}
.theme .th-tx .s{font-size:13px;color:var(--ink-3)}
.theme .th-n{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:4px 11px;white-space:nowrap}
.theme-body{display:none;padding:0 24px 24px;border-top:1px solid var(--line)}
.theme.open .theme-body{display:block;animation:fade .26s}
.theme.open>.th-hd .caret{transform:rotate(180deg)}
.mcard{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);padding:20px;margin-top:18px}
.mcard .mh{display:flex;justify-content:space-between;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.mcard h4{font-size:16px}
.mcard .per{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.mcard>p{font-size:14px;color:var(--ink-2);margin:0 0 14px}
.cah{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
@media(max-width:760px){.cah{grid-template-columns:1fr}}
.cah>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:15px;border-top:3px solid var(--line-2)}
.cah>div:nth-child(1){border-top-color:var(--warn)}
.cah>div:nth-child(2){border-top-color:var(--accent)}
.cah>div:nth-child(3){border-top-color:var(--ok)}
.cah h5{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin:0 0 7px;font-weight:750}
.cah p{font-size:13.4px;color:var(--ink-2);margin:0}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:13px;margin-bottom:16px}
.metric{border:1px solid var(--line);border-radius:var(--radius-sm);padding:15px 17px;background:var(--surface)}
.metric .m{font-family:var(--mono);font-size:22px;font-weight:750;letter-spacing:-.035em;line-height:1.1}
.metric .m.up{color:var(--ok)}.metric .m.down{color:var(--bad)}.metric .m.neu{color:var(--accent)}
.metric .l{font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.45}
.bullets{margin:0 0 16px;padding-left:20px}
.bullets li{margin-bottom:9px;font-size:14px;color:var(--ink-2)}
.bullets li strong{color:var(--ink);font-weight:640}

/* CARD INDEX (école / asso) */
.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.icard{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:0 0 24px;box-shadow:var(--shadow);transition:.2s;display:flex;flex-direction:column;gap:11px;color:var(--ink);overflow:hidden}
.icard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
.icard .thumb{width:100%;height:150px;object-fit:cover;display:block;background:var(--surface-2)}
.icard .in{padding:0 24px;display:flex;flex-direction:column;gap:10px;flex:1}
.icard .in.pt{padding-top:24px}

  {id:"analytics", ic:"M3 20h18 M6 20V9 M11 20V4 M16 20v-7 M21 20v-11", org:"Groupama · 2025-2026",

       ["Des taux de conversion, d'engagement et de lead suivis quotidiennement par tout le pôle digital — et un trafic automatisé capable de les fausser du jour au lendemain.","Conversion, engagement and lead rates tracked daily by the whole digital division — and automated traffic able to distort them overnight."],
       ["Relevé quotidien dans Adobe Analytics, vérification qu'une adresse détectée n'est pas une campagne légitime, ajout au segment d'exclusion. Traitement jour par jour : une plage de plusieurs jours fausse le tri. En parallèle, contrôle de l'évolution de chaque indicateur et alertes qualifiées sur les variations anormales.","Daily review in Adobe Analytics, verification that a flagged address is not a legitimate campaign, addition to the exclusion segment. Processed day by day: a multi-day range breaks the sorting. In parallel, monitoring of each indicator and qualified alerts on abnormal variations."],
       ["Un référentiel de mesure fiable pour tout le pôle, et un réflexe de contrôle de cohérence que j'applique désormais à toutes mes analyses.","A reliable measurement baseline for the whole division, and a consistency-check reflex I now apply to every analysis."]],

  {id:"ia", ic:"M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z M9 21h6", org:"Groupama · 2025-2026",
   n:["IA &amp; automatisation","AI &amp; automation"],
   s:["Automatiser ce qui est répétitif pour protéger le temps d'analyse, en gardant l'humain sur le contrôle.","Automating the repetitive to protect analysis time, keeping humans on the control."],
   items:[

     teaser:["La consolidation hebdomadaire des résultats représentait plusieurs heures de saisie à faible valeur ajoutée et à fort risque d'erreur.","Weekly results consolidation took several hours of low-value, high-error-risk data entry."],
     cah:[
       ["Trois chaînes très manuelles : consolidation des résultats de tests, mise en forme du suivi quotidien de performance, traitement des avis déposés sur les stores mobiles.","Three highly manual chains: test results consolidation, formatting of the daily performance tracking, processing of mobile app store reviews."],
       ["Conception et documentation de prompts structurés intégrant des <b>règles de contrôle explicites</b> : signalement des taux non calculés, alerte sur les pourcentages aberrants, interdiction de modifier les onglets protégés, périmètre strictement délimité.","Design and documentation of structured prompts embedding <b>explicit control rules</b>: flagging uncalculated rates, alerting on aberrant percentages, forbidding edits to protected tabs, strictly bounded scope."],
       ["Le contrôle final reste humain. Le temps libéré a été réinvesti dans l'analyse, et les prompts sont documentés dans les six modes opératoires laissés à l'équipe.","The final check stays human. The time freed was reinvested into analysis, and the prompts are documented in the six standard operating procedures left with the team."]],
     metrics:[{m:"3", c:"neu", l:["chaînes de reporting récurrentes automatisées","recurring reporting chains automated"]},{m:"100 %", c:"up", l:["des sorties passées en validation humaine","of outputs kept under human validation"]},{m:"6", c:"neu", l:["modes opératoires écrits laissés à l'équipe","written procedures left with the team"]}],
     honest:["<b>Ce que je n'ai pas mené à terme.</b> L'objectif d'automatiser par IA le tri du trafic robot n'a pas été atteint : sujet critique pour la fiabilité de toutes les analyses, migration d'outil annoncée, charge récurrente. J'ai préféré documenter la règle de décision pour que l'automatisation soit reprise sur une base explicite. Sur un sujet critique, la bonne décision n'est pas toujours d'automatiser.",
     "<b>What I did not complete.</b> The objective of automating bot-traffic sorting with AI was not met: a subject critical to the reliability of every analysis, an announced tool migration, a recurring workload. I chose to document the decision rule so automation can be resumed on an explicit basis. On a critical subject, the right decision is not always to automate."],

  document.getElementById("tabs").innerHTML=TABS.map(function(x){
    return '<button class="tab" role="tab" id="tab-'+x.id+'" aria-selected="'+(CUR===x.id)+'" onclick="go(\''+x.id+'\')">'+ic(x.icon,15)+t(x.label)+'</button>';
  }).join("");
}
function renderAll(){
  TABS.forEach(function(x){ document.getElementById("p-"+x.id).innerHTML=RENDER[x.id](); });
  renderTabs(); buildIndex(); animateBars(); reHL();
}
function go(id,anchor){
  CUR=id;
  TABS.forEach(function(x){
    document.getElementById("p-"+x.id).classList.toggle("on", x.id===id);
    var b=document.getElementById("tab-"+x.id); if(b) b.setAttribute("aria-selected", x.id===id);
  });
  history.replaceState(null,"","#"+id);
  reHL();
  if(anchor){
    setTimeout(function(){
      var el=document.getElementById(anchor);
      if(el){ window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-140,behavior:"smooth"});
        el.classList.remove("hl-flash"); void el.offsetWidth; el.classList.add("hl-flash"); }
    },70);
  } else window.scrollTo({top:0,behavior:"smooth"});
  animateBars();
}
function fold(el){ el.classList.toggle("open"); }
function animateBars(){
  requestAnimationFrame(function(){
    document.querySelectorAll(".bar i[data-w], .trk i[data-w]").forEach(function(b,i){
      setTimeout(function(){ b.style.width=b.getAttribute("data-w")+"%"; },40+i*22);
    });
  });
}

/* ---------- I18N / THÈME ---------- */
function applyStatic(){
  document.querySelectorAll("[data-i18n]").forEach(function(e){ e.innerHTML=t(T[e.getAttribute("data-i18n")]); });
  document.querySelectorAll("[data-i18n-ph]").forEach(function(e){ e.placeholder=t(T[e.getAttribute("data-i18n-ph")]); });
  document.title = L ? "Axelle Poncet — Data & AI Project Manager" : "Axelle Poncet — Cheffe de projet Data & IA";
}
function setLang(l){
  L=(l==="en")?1:0;
  document.documentElement.lang=l;
  document.getElementById("lang-fr").setAttribute("aria-pressed",L===0);
  document.getElementById("lang-en").setAttribute("aria-pressed",L===1);
  applyStatic();
  try{ localStorage.setItem("ap-lang",l); }catch(e){}
  renderAll(); go(CUR);
  var q=document.getElementById("q"); if(q.value) doSearch(q.value); else closeRes();
}
function applyTheme(th){
  document.documentElement.setAttribute("data-theme",th);
  document.getElementById("themeIco").innerHTML = th==="dark"
    ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2 M12 20v2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M2 12h2 M20 12h2 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4"/>'
    : '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>';
  try{ localStorage.setItem("ap-theme",th); }catch(e){}
}
function toggleTheme(){ applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"); }

/* ---------- SURLIGNAGE DANS LA PAGE ---------- */
function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function clearHL(){
  document.querySelectorAll("mark.sq").forEach(function(m){
    var p=m.parentNode; if(!p) return;
    p.replaceChild(document.createTextNode(m.textContent), m); p.normalize();
  });
}
function highlightAll(term){
  clearHL();
  if(!term || term.trim().length<2) return;
  var nq=norm(term.trim()), panel=document.getElementById("p-"+CUR);
  if(!panel) return;
  var walker=document.createTreeWalker(panel, NodeFilter.SHOW_TEXT, {
    acceptNode:function(n){
      if(!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      var nm=n.parentNode && n.parentNode.nodeName;
      if(nm==="SCRIPT"||nm==="STYLE"||nm==="MARK"||nm==="TEXTAREA") return NodeFilter.FILTER_REJECT;
      return norm(n.nodeValue).indexOf(nq)>-1 ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  var nodes=[],n; while((n=walker.nextNode())) nodes.push(n);
  var first=null;
  nodes.forEach(function(node){
    var txt=node.nodeValue, nt=norm(txt), i=nt.indexOf(nq);
    if(i<0 || nt.length!==txt.length) return;
    var frag=document.createDocumentFragment(), last=0;
    while(i>-1){
      if(i>last) frag.appendChild(document.createTextNode(txt.slice(last,i)));
      var mk=document.createElement("mark"); mk.className="sq"; mk.textContent=txt.slice(i,i+nq.length);
      frag.appendChild(mk); if(!first) first=mk;
      last=i+nq.length; i=nt.indexOf(nq,last);
    }
    if(last<txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
    if(node.parentNode) node.parentNode.replaceChild(frag,node);
  });
  return first;
}
function reHL(){ if(HLTERM) setTimeout(function(){ highlightAll(HLTERM) },30); }
function runHL(term){
  HLTERM=term;
  var first=highlightAll(term);
  if(first){ var y=first.getBoundingClientRect().top+window.scrollY-170; window.scrollTo({top:Math.max(0,y),behavior:"smooth"}); }
}

/* ---------- RECHERCHE ---------- */
var IDX=[],LAST=[];
function buildIndex(){
  IDX=[];
  ["home","cv","skills","awards","reco","contact"].forEach(function(id){
    var tb=TABS.filter(function(x){return x.id===id})[0], panel=document.getElementById("p-"+id);
    panel.querySelectorAll("[data-s]").forEach(function(el,i){
      if(!el.id) el.id="s-"+id+"-"+i;
      var hd=el.querySelector("h3,h4,b,.v"), title=hd?hd.textContent.trim():el.getAttribute("data-s").slice(0,60);
      var body=(el.getAttribute("data-s")||"")+" "+el.textContent.replace(/\s+/g," ");
      IDX.push({tab:id,tabLabel:t(tb.label),el:el.id,title:title.slice(0,88),body:body.slice(0,1200),n:norm(title+" "+body)});
    });
  });
  var wtb=TABS.filter(function(x){return x.id==="work"})[0];
  WORK.themes.forEach(function(th){
    th.items.forEach(function(m){
      var body=[t(m.teaser),m.cah.map(strip).join(" "),(m.tags||[]).join(" "),
                (m.metrics||[]).map(function(x){return t(x.m)+" "+t(x.l)}).join(" "),
                m.table?m.table.rows.map(function(r){return t(r[0])+" "+t(r[2])}).join(" "):""].join(" ");
      IDX.push({tab:"work",tabLabel:t(wtb.label),act:"openTheme",id:th.id,anchor:"th-"+th.id,title:t(m.h),body:body.slice(0,1600),n:norm(t(m.h)+" "+body+" "+t(th.n))});
    });
  });
  [["school",SCHOOL,"openSchool"],["asso",ASSO,"openAsso"]].forEach(function(cfg){
    var tb=TABS.filter(function(x){return x.id===cfg[0]})[0];
    cfg[1].items.forEach(function(x){
      var body=[t(x.teaser),t(x.lead),x.cah.map(strip).join(" "),(x.tags||[]).join(" "),
                (x.metrics||[]).map(function(m){return t(m.m)+" "+t(m.l)}).join(" "),
                (x.bullets||[]).map(strip).join(" ")].join(" ");
      IDX.push({tab:cfg[0],tabLabel:t(tb.label),act:cfg[2],id:x.id,title:t(x.h),body:body.slice(0,1600),n:norm(t(x.h)+" "+body+" "+t(x.org))});
    });
  });
}
var SUGG=[["A/B testing","A/B testing"],["Adobe Analytics","Adobe Analytics"],["IA générative","Generative AI"],
  ["Taux de conversion","Conversion rate"],["Gouvernance de l'IA","AI governance"],["Gestion de projet","Project management"],
  ["Contentsquare","Contentsquare"],["AgilePM","AgilePM"],["Hackathon","Hackathon"],["Green Seed","Green Seed"],
  ["Étude de marché","Market research"],["Python","Python"]];
function closeRes(){ document.getElementById("results").classList.remove("on"); }
function showSuggestions(){
  var r=document.getElementById("results");
  r.innerHTML='<div class="res-head">'+t(T.suggTitle)+'</div><div class="sugg">'+
    SUGG.map(function(s){return '<button onclick="pick(\''+t(s).replace(/'/g,"\\'")+'\')">'+t(s)+'</button>'}).join("")+'</div>';
  r.classList.add("on");
}
function pick(v){ var q=document.getElementById("q"); q.value=v; doSearch(v); q.focus(); }
function hi(txt,q){
  var i=norm(txt).indexOf(norm(q));
  if(i<0) return esc(txt.slice(0,110));
  var s=Math.max(0,i-34), e=Math.min(txt.length,i+q.length+72);
  return (s>0?"…":"")+esc(txt.slice(s,i))+"<mark>"+esc(txt.slice(i,i+q.length))+"</mark>"+esc(txt.slice(i+q.length,e))+(e<txt.length?"…":"");
}
function doSearch(q){
  var r=document.getElementById("results");
  if(!q||q.trim().length<2){ showSuggestions(); return; }
  var nq=norm(q.trim()), hits=IDX.filter(function(x){return x.n.indexOf(nq)>-1}), seen={}, out=[];
  hits.forEach(function(h){ var k=h.tab+"|"+h.title; if(!seen[k]){seen[k]=1;out.push(h)} });
  out.sort(function(a,b){ var ia=norm(a.title).indexOf(nq), ib=norm(b.title).indexOf(nq); return (ia<0?999:ia)-(ib<0?999:ib); });
  if(!out.length){
    r.innerHTML='<div class="res-head">'+t(T.noRes)+'</div><div class="sugg">'+
      SUGG.map(function(s){return '<button onclick="pick(\''+t(s).replace(/'/g,"\\'")+'\')">'+t(s)+'</button>'}).join("")+'</div>';
    r.classList.add("on"); LAST=[]; return;
  }
  LAST=out.slice(0,14);
  r.innerHTML='<div class="res-head">'+t(T.resTitle)+' · '+out.length+'</div>'+
    LAST.map(function(h,i){
      return '<button class="res-item" onclick="jump('+i+')">'+
        '<span class="rt"><span class="chip-tab">'+h.tabLabel+'</span>'+esc(h.title)+'</span>'+
        '<span class="rs" style="display:block">'+hi(h.body,q.trim())+'</span></button>';
    }).join("");
  r.classList.add("on");
}
function jump(i){
  var h=LAST[i]; if(!h) return;
  closeRes();
  var term=document.getElementById("q").value;
  if(h.act){
    go(h.tab);
    window[h.act](h.id);
    HLTERM=term;
    setTimeout(function(){
      if(h.anchor){ var el=document.getElementById(h.anchor);
        if(el){ el.classList.add("open"); window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-140,behavior:"smooth"}); } }
      highlightAll(term);
    },120);
    return;
  }
  var el=document.getElementById(h.el), fd=el&&(el.closest(".fold")||el.closest(".tl-item")||el.closest(".theme"));
  if(fd) fd.classList.add("open");
  HLTERM=term;
  go(h.tab,h.el);
}
function submitSearch(){
  var q=document.getElementById("q"), v=q.value.trim();
  if(!v){ q.focus(); showSuggestions(); return; }
  if(LAST.length){ jump(0); }
  else { closeRes(); runHL(v); }
}

/* ---------- INIT ---------- */
(function init(){
  var th="light", lg="fr";
  try{
    th=localStorage.getItem("ap-theme")||(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
    lg=localStorage.getItem("ap-lang")||"fr";
  }catch(e){}
  applyTheme(th);
  L=lg==="en"?1:0;
  document.documentElement.lang=lg;
  document.getElementById("lang-fr").setAttribute("aria-pressed",L===0);
  document.getElementById("lang-en").setAttribute("aria-pressed",L===1);
  applyStatic();
  renderAll();
  var h=(location.hash||"").replace("#","");
  go(TABS.some(function(x){return x.id===h})?h:"home");

  var q=document.getElementById("q"), res=document.getElementById("results");
  q.addEventListener("input",function(){
    if(!q.value.trim()){ HLTERM=""; clearHL(); showSuggestions(); return; }
    doSearch(q.value);
  });
  q.addEventListener("search",function(){ if(!q.value.trim()){ HLTERM=""; clearHL(); closeRes(); } });
  q.addEventListener("focus",function(){ q.value?doSearch(q.value):showSuggestions(); });
  document.getElementById("goBtn").addEventListener("click",submitSearch);
  q.addEventListener("keydown",function(e){
    var items=res.querySelectorAll(".res-item"), cur=res.querySelector(".res-item.sel");
    if(e.key==="Escape"){ closeRes(); q.blur(); }
    if(e.key==="ArrowDown"&&items.length){ e.preventDefault(); var i=cur?[].indexOf.call(items,cur)+1:0; if(cur)cur.classList.remove("sel"); var n=items[Math.min(i,items.length-1)]; n.classList.add("sel"); n.scrollIntoView({block:"nearest"}); }
    if(e.key==="ArrowUp"&&items.length){ e.preventDefault(); var i2=cur?[].indexOf.call(items,cur)-1:0; if(cur)cur.classList.remove("sel"); var n2=items[Math.max(i2,0)]; n2.classList.add("sel"); n2.scrollIntoView({block:"nearest"}); }
    if(e.key==="Enter"){ e.preventDefault(); if(cur) cur.click(); else submitSearch(); }
  });
  document.addEventListener("click",function(e){
    if(!e.target.closest(".searchbar")) closeRes();
    if(!e.target.closest(".tip")) document.querySelectorAll(".tip.on").forEach(function(x){x.classList.remove("on")});
  });
  var up=document.getElementById("up");
  window.addEventListener("scroll",function(){ up.classList.toggle("on",window.scrollY>520); },{passive:true});
  window.addEventListener("hashchange",function(){
    var hh=(location.hash||"").replace("#","");
    if(hh!==CUR && TABS.some(function(x){return x.id===hh})) go(hh);
  });
})();
</script>
